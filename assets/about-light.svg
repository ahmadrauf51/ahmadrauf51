  <text x="44" y="76" text-anchor="end" class="mono" font-size="12.5" fill="#C3CCD8">1</text><text x="64" y="76" class="mono" font-size="14" xml:space="preserve"><tspan fill="#94A3B8" font-style="italic">// Most of my client work lives in private repos (NDA).</tspan></text><text x="44" y="99" text-anchor="end" class="mono" font-size="12.5" fill="#C3CCD8">2</text><text x="64" y="99" class="mono" font-size="14" xml:space="preserve"><tspan fill="#94A3B8" font-style="italic">// Happy to walk you through architecture &amp; code on a call.</tspan></text><text x="44" y="122" text-anchor="end" class="mono" font-size="12.5" fill="#C3CCD8">3</text><text x="44" y="145" text-anchor="end" class="mono" font-size="12.5" fill="#C3CCD8">4</text><text x="64" y="145" class="mono" font-size="14" xml:space="preserve"><tspan fill="#2563EB">const </tspan><tspan fill="#0F172A">ahmad</tspan><tspan fill="#94A3B8"> = {</tspan></text><text x="44" y="168" text-anchor="end" class="mono" font-size="12.5" fill="#C3CCD8">5</text><text x="64" y="168" class="mono" font-size="14" xml:space="preserve"><tspan fill="#94A3B8">  </tspan><tspan fill="#475569">role</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#1D4ED8">&quot;Senior Full Stack Engineer&quot;</tspan><tspan fill="#94A3B8">,</tspan></text><text x="44" y="191" text-anchor="end" class="mono" font-size="12.5" fill="#C3CCD8">6</text><text x="64" y="191" class="mono" font-size="14" xml:space="preserve"><tspan fill="#94A3B8">  </tspan><tspan fill="#475569">location</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#1D4ED8">&quot;Lahore, Pakistan (UTC+5)&quot;</tspan><tspan fill="#94A3B8">,</tspan></text><text x="44" y="214" text-anchor="end" class="mono" font-size="12.5" fill="#C3CCD8">7</text><text x="64" y="214" class="mono" font-size="14" xml:space="preserve"><tspan fill="#94A3B8">  </tspan><tspan fill="#475569">codingSince</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#2563EB">2018</tspan><tspan fill="#94A3B8">,</tspan></text><text x="44" y="237" text-anchor="end" class="mono" font-size="12.5" fill="#C3CCD8">8</text><text x="64" y="237" class="mono" font-size="14" xml:space="preserve"><tspan fill="#94A3B8">  </tspan><tspan fill="#475569">stack</tspan><tspan fill="#94A3B8">: {</tspan></text><text x="44" y="260" text-anchor="end" class="mono" font-size="12.5" fill="#C3CCD8">9</text><text x="64" y="260" class="mono" font-size="14" xml:space="preserve"><tspan fill="#94A3B8">    </tspan><tspan fill="#475569">frontend</tspan><tspan fill="#94A3B8">: [</tspan><tspan fill="#1D4ED8">&quot;React&quot;</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#1D4ED8">&quot;Next.js&quot;</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#1D4ED8">&quot;Vue&quot;</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#1D4ED8">&quot;Nuxt&quot;</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#1D4ED8">&quot;Tailwind&quot;</tspan><tspan fill="#94A3B8">],</tspan></text><text x="44" y="283" text-anchor="end" class="mono" font-size="12.5" fill="#C3CCD8">10</text><text x="64" y="283" class="mono" font-size="14" xml:space="preserve"><tspan fill="#94A3B8">    </tspan><tspan fill="#475569">backend</tspan><tspan fill="#94A3B8">:  [</tspan><tspan fill="#1D4ED8">&quot;Laravel&quot;</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#1D4ED8">&quot;Node.js&quot;</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#1D4ED8">&quot;NestJS&quot;</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#1D4ED8">&quot;GraphQL&quot;</tspan><tspan fill="#94A3B8">],</tspan></text><text x="44" y="306" text-anchor="end" class="mono" font-size="12.5" fill="#C3CCD8">11</text><text x="64" y="306" class="mono" font-size="14" xml:space="preserve"><tspan fill="#94A3B8">    </tspan><tspan fill="#475569">data</tspan><tspan fill="#94A3B8">:     [</tspan><tspan fill="#1D4ED8">&quot;MySQL&quot;</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#1D4ED8">&quot;PostgreSQL&quot;</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#1D4ED8">&quot;MongoDB&quot;</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#1D4ED8">&quot;Redis&quot;</tspan><tspan fill="#94A3B8">],</tspan></text><text x="44" y="329" text-anchor="end" class="mono" font-size="12.5" fill="#C3CCD8">12</text><text x="64" y="329" class="mono" font-size="14" xml:space="preserve"><tspan fill="#94A3B8">    </tspan><tspan fill="#475569">cloud</tspan><tspan fill="#94A3B8">:    [</tspan><tspan fill="#1D4ED8">&quot;AWS&quot;</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#1D4ED8">&quot;Azure&quot;</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#1D4ED8">&quot;GCP&quot;</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#1D4ED8">&quot;Docker&quot;</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#1D4ED8">&quot;K8s&quot;</tspan><tspan fill="#94A3B8">],</tspan></text><text x="44" y="352" text-anchor="end" class="mono" font-size="12.5" fill="#C3CCD8">13</text><text x="64" y="352" class="mono" font-size="14" xml:space="preserve"><tspan fill="#94A3B8">  },</tspan></text><text x="44" y="375" text-anchor="end" class="mono" font-size="12.5" fill="#C3CCD8">14</text><text x="64" y="375" class="mono" font-size="14" xml:space="preserve"><tspan fill="#94A3B8">  </tspan><tspan fill="#475569">focus</tspan><tspan fill="#94A3B8">: [</tspan><tspan fill="#1D4ED8">&quot;SaaS&quot;</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#1D4ED8">&quot;APIs &amp; integrations&quot;</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#1D4ED8">&quot;AI search (RAG)&quot;</tspan><tspan fill="#94A3B8">],</tspan></text><text x="44" y="398" text-anchor="end" class="mono" font-size="12.5" fill="#C3CCD8">15</text><text x="64" y="398" class="mono" font-size="14" xml:space="preserve"><tspan fill="#94A3B8">  </tspan><tspan fill="#475569">workStyle</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#1D4ED8">&quot;remote-first, async, owns it end to end&quot;</tspan><tspan fill="#94A3B8">,</tspan></text><text x="44" y="421" text-anchor="end" class="mono" font-size="12.5" fill="#C3CCD8"