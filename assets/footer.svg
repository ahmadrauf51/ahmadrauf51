<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" fill="none" role="img" aria-label="Have a product to build or a system to scale? Let's talk.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="900" y2="190" gradientUnits="userSpaceOnUse"><stop stop-color="#0A0D13"/><stop offset="1" stop-color="#0F131B"/></linearGradient>
  <radialGradient id="oA"><stop stop-color="#3B82F6" stop-opacity=".22"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></radialGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="900" y2="190" gradientUnits="userSpaceOnUse"><stop stop-color="#3B82F6" stop-opacity=".55"/><stop offset=".35" stop-color="#1E2531"/><stop offset="1" stop-color="#1E2531"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" stroke="#FFFFFF" stroke-opacity=".03"/></pattern>
  <clipPath id="clip"><rect width="900" height="190" rx="20"/></clipPath>
</defs>
<style>
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
  .mono{font-family:'SFMono-Regular','JetBrains Mono',Consolas,'Liberation Mono',Menlo,monospace}

  .fa{animation:fa 16s ease-in-out infinite}
  @keyframes fa{0%,100%{transform:translate(0,0)}50%{transform:translate(120px,0)}}
  .arrow{animation:ar 1.6s ease-in-out infinite}
  @keyframes ar{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
</style>
<g clip-path="url(#clip)">
  <rect width="900" height="190" fill="url(#bg)"/>
  <rect width="900" height="190" fill="url(#grid)"/>
  <circle class="fa" cx="330" cy="200" r="260" fill="url(#oA)"/>
  <text x="450.0" y="64" text-anchor="middle" class="sans" font-size="27" font-weight="800" letter-spacing="-.5" fill="#F3F5F8">Have a product to build or a system to scale?</text>
  <text x="450.0" y="94" text-anchor="middle" class="sans" font-size="15" fill="#8A94A3">I'm always up for interesting problems and good people to solve them with.</text>
  <g transform="translate(354.0 116)">
    <rect width="192" height="42" rx="21" fill="#3B82F6"/>
    <text x="80" y="26.5" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#fff">Let's talk</text>
    <g class="arrow"><path d="M128 21h24m-8-7 8 7-8 7" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g>
  </g>
</g>
<rect x=".5" y=".5" width="899" height="189" rx="19.5" stroke="url(#edge)"/>
</svg>