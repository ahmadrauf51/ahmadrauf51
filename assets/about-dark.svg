  <text x="44" y="76" text-anchor="end" class="mono" font-size="12.5" fill="#2E3542">1</text><text x="64" y="76" class="mono" font-size="14" xml:space="preserve"><tspan fill="#4B5461" font-style="italic">// Most of my client work lives in private repos (NDA).</tspan></text><text x="44" y="99" text-anchor="end" class="mono" font-size="12.5" fill="#2E3542">2</text><text x="64" y="99" class="mono" font-size="14" xml:space="preserve"><tspan fill="#4B5461" font-style="italic">// Happy to walk you through architecture &amp; code on a call.</tspan></text><text x="44" y="122" text-anchor="end" class="mono" font-size="12.5" fill="#2E3542">3</text><text x="44" y="145" text-anchor="end" class="mono" font-size="12.5" fill="#2E3542">4</text><text x="64" y="145" class="mono" font-size="14" xml:space="preserve"><tspan fill="#60A5FA">const </tspan><tspan fill="#F3F5F8">ahmad</tspan><tspan fill="#6B7584"> = {</tspan></text><text x="44" y="168" text-anchor="end" class="mono" font-size="12.5" fill="#2E3542">5</text><text x="64" y="168" class="mono" font-size="14" xml:space="preserve"><tspan fill="#6B7584">  </tspan><tspan fill="#AAB4C3">role</tspan><tspan fill="#6B7584">: </tspan><tspan fill="#93C5FD">&quot;Senior Full Stack Engineer&quot;</tspan><tspan fill="#6B7584">,</tspan></text><text x="44" y="191" text-anchor="end" class="mono" font-size="12.5" fill="#2E3542">6</text><text x="64" y="191" class="mono" font-size="14" xml:space="preserve"><tspan fill="#6B7584">  </tspan><tspan fill="#AAB4C3">location</tspan><tspan fill="#6B7584">: </tspan><tspan fill="#93C5FD">&quot;Lahore, Pakistan (UTC+5)&quot;</tspan><tspan fill="#6B7584">,</tspan></text><text x="44" y="214" text-anchor="end" class="mono" font-size="12.5" fill="#2E3542">7</text><text x="64" y="214" class="mono" font-size="14" xml:space="preserve"><tspan fill="#6B7584">  </tspan><tspan fill="#AAB4C3">codingSince</tspan><tspan fill="#6B7584">: </tspan><tspan fill="#60A5FA">2018</tspan><tspan fill="#6B7584">,</tspan></text><text x="44" y="237" text-anchor="end" class="mono" font-size="12.5" fill="#2E3542">8</text><text x="64" y="237" class="mono" font-size="14" xml:space="preserve"><tspan fill="#6B7584">  </tspan><tspan fill="#AAB4C3">stack</tspan><tspan fill="#6B7584">: {</tspan></text><text x="44" y="260" text-anchor="end" class="mono" font-size="12.5" fill="#2E3542">9</text><text x="64" y="260" class="mono" font-size="14" xml:space="preserve"><tspan fill="#6B7584">    </tspan><tspan fill="#AAB4C3">frontend</tspan><tspan fill="#6B7584">: [</tspan><tspan fill="#93C5FD">&quot;React&quot;</tspan><tspan fill="#6B7584">, </tspan><tspan fill="#93C5FD">&quot;Next.js&quot;</tspan><tspan fill="#6B7584">, </tspan><tspan fill="#93C5FD">&quot;Vue&quot;</tspan><tspan fill="#6B7584">, </tspan><tspan fill="#93C5FD">&quot;Nuxt&quot;</tspan><tspan fill="#6B7584">, </tspan><tspan fill="#93C5FD">&quot;Tailwind&quot;</tspan><tspan fill="#6B7584">],</tspan></text><text x="44" y="283" text-anchor="end" class="mono" font-size="12.5" fill="#2E3542">10</text><text x="64" y="283" class="mono" font-size="14" xml:space="preserve"><tspan fill="#6B7584">    </tspan><tspan fill="#AAB4C3">backend</tspan><tspan fill="#6B7584">:  [</tspan><tspan fill="#93C5FD">&quot;Laravel&quot;</tspan><tspan fill="#6B7584">, </tspan><tspan fill="#93C5FD">&quot;Node.js&quot;</tspan><tspan fill="#6B7584">, </tspan><tspan fill="#93C5FD">&quot;NestJS&quot;</tspan><tspan fill="#6B7584">, </tspan><tspan fill="#93C5FD">&quot;GraphQL&quot;</tspan><tspan fill="#6B7584">],</tspan></text><text x="44" y="306" text-anchor="end" class="mono" font-size="12.5" fill="#2E3542">11</text><text x="64" y="306" class="mono" font-size="14" xml:space="preserve"><tspan fill="#6B7584">    </tspan><tspan fill="#AAB4C3">data</tspan><tspan fill="#6B7584">:     [</tspan><tspan fill="#93C5FD">&quot;MySQL&quot;</tspan><tspan fill="#6B7584">, </tspan><tspan fill="#93C5FD">&quot;PostgreSQL&quot;</tspan><tspan fill="#6B7584">, </tspan><tspan fill="#93C5FD">&quot;MongoDB&quot;</tspan><tspan fill="#6B7584">, </tspan><tspan fill="#93C5FD">&quot;Redis&quot;</tspan><tspan fill="#6B7584">],</tspan></text><text x="44" y="329" text-anchor="end" class="mono" font-size="12.5" fill="#2E3542">12</text><text x="64" y="329" class="mono" font-size="14" xml:space="preserve"><tspan fill="#6B7584">    </tspan><tspan fill="#AAB4C3">cloud</tspan><tspan fill="#6B7584">:    [</tspan><tspan fill="#93C5FD">&quot;AWS&quot;</tspan><tspan fill="#6B7584">, </tspan><tspan fill="#93C5FD">&quot;Azure&quot;</tspan><tspan fill="#6B7584">, </tspan><tspan fill="#93C5FD">&quot;GCP&quot;</tspan><tspan fill="#6B7584">, </tspan><tspan fill="#93C5FD">&quot;Docker&quot;</tspan><tspan fill="#6B7584">, </tspan><tspan fill="#93C5FD">&quot;K8s&quot;</tspan><tspan fill="#6B7584">],</tspan></text><text x="44" y="352" text-anchor="end" class="mono" font-size="12.5" fill="#2E3542">13</text><text x="64" y="352" class="mono" font-size="14" xml:space="preserve"><tspan fill="#6B7584">  },</tspan></text><text x="44" y="375" text-anchor="end" class="mono" font-size="12.5" fill="#2E3542">14</text><text x="64" y="375" class="mono" font-size="14" xml:space="preserve"><tspan fill="#6B7584">  </tspan><tspan fill="#AAB4C3">focus</tspan><tspan fill="#6B7584">: [</tspan><tspan fill="#93C5FD">&quot;SaaS&quot;</tspan><tspan fill="#6B7584">, </tspan><tspan fill="#93C5FD">&quot;APIs &amp; integrations&quot;</tspan><tspan fill="#6B7584">, </tspan><tspan fill="#93C5FD">&quot;AI search (RAG)&quot;</tspan><tspan fill="#6B7584">],</tspan></text><text x="44" y="398" text-anchor="end" class="mono" font-size="12.5" fill="#2E3542">15</text><text x="64" y="398" class="mono" font-size="14" xml:space="preserve"><tspan fill="#6B7584">  </tspan><tspan fill="#AAB4C3">workStyle</tspan><tspan fill="#6B7584">: </tspan><tspan fill="#93C5FD">&quot;remote-first, async, owns it end to end&quot;</tspan><tspan fill="#6B7584">,</tspan></text><text x="44" y="421" text-anchor="end" class="mono" font-size="12.5" fill="#2E3542"