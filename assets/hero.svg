<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" fill="none" role="img" aria-label="Muhammad Ahmad Rauf, Senior Full Stack Engineer">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="900" y2="320" gradientUnits="userSpaceOnUse"><stop stop-color="#0A0D13"/><stop offset="1" stop-color="#0F131B"/></linearGradient>
  <radialGradient id="oA"><stop stop-color="#3B82F6" stop-opacity=".28"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></radialGradient>
  <radialGradient id="oB"><stop stop-color="#3B82F6" stop-opacity=".16"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></radialGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="900" y2="320" gradientUnits="userSpaceOnUse"><stop stop-color="#3B82F6" stop-opacity=".55"/><stop offset=".35" stop-color="#1E2531"/><stop offset="1" stop-color="#1E2531"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" stroke="#FFFFFF" stroke-opacity=".035"/></pattern>
  <radialGradient id="fade" cx=".3" cy=".4" r=".8"><stop stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <mask id="gridMask"><rect width="900" height="320" fill="url(#fade)"/></mask>
  <clipPath id="clip"><rect width="900" height="320" rx="20"/></clipPath>
</defs>
<style>
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
  .mono{font-family:'SFMono-Regular','JetBrains Mono',Consolas,'Liberation Mono',Menlo,monospace}

  .fa{animation:fa 16s ease-in-out infinite}
  .fb{animation:fb 20s ease-in-out infinite}
  @keyframes fa{0%,100%{transform:translate(0,0)}50%{transform:translate(50px,25px)}}
  @keyframes fb{0%,100%{transform:translate(0,0)}50%{transform:translate(-60px,-20px)}}
  .spin{transform-origin:728px 150px;animation:spin 28s linear infinite}
  .spinr{transform-origin:728px 150px;animation:spin 42s linear infinite reverse}
  @keyframes spin{to{transform:rotate(360deg)}}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
  @keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(3);opacity:0}}
  .ph{animation:ph 9s linear infinite}
  .p2{animation-delay:3s} .p3{animation-delay:6s}
  @keyframes ph{0%{fill-opacity:0}4%{fill-opacity:1}30%{fill-opacity:1}34%{fill-opacity:0}100%{fill-opacity:0}}
  .glow{animation:glow 4s ease-in-out infinite}
  @keyframes glow{0%,100%{opacity:.5}50%{opacity:1}}
</style>
<g clip-path="url(#clip)">
  <rect width="900" height="320" fill="url(#bg)"/>
  <rect width="900" height="320" fill="url(#grid)" mask="url(#gridMask)"/>
  <circle class="fa" cx="110" cy="20" r="250" fill="url(#oA)"/>
  <circle class="fb" cx="780" cy="300" r="230" fill="url(#oB)"/>

  <g transform="translate(48 38)">
    <rect x=".5" y=".5" width="261" height="27" rx="13.5" fill="#3B82F6" fill-opacity=".08" stroke="#3B82F6" stroke-opacity=".35"/>
    <circle cx="16" cy="14" r="3.5" fill="#60A5FA" class="glow"/>
    <text x="28" y="18.5" class="mono" font-size="11" font-weight="700" letter-spacing="1.8" fill="#93C5FD">SENIOR FULL STACK ENGINEER</text>
  </g>

  <text x="46" y="124" class="sans" font-size="46" font-weight="800" letter-spacing="-1" fill="#F3F5F8">Muhammad Ahmad Rauf</text>
  <text x="48" y="160" class="sans" font-size="17" fill="#8A94A3">I design and ship fast, scalable web platforms,</text>
  <text x="48" y="184" class="sans" font-size="17" fill="#8A94A3">from clean APIs to <tspan fill="#F3F5F8" font-weight="600">interfaces people enjoy using.</tspan></text>
  <g transform="translate(48 204)"><rect x=".5" y=".5" width="69" height="29" rx="14.5" fill="#0D1118" fill-opacity=".6" stroke="#2A3240"/><text x="35.0" y="19.5" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#C5CCD6">Laravel</text></g><g transform="translate(126 204)"><rect x=".5" y=".5" width="71" height="29" rx="14.5" fill="#0D1118" fill-opacity=".6" stroke="#2A3240"/><text x="36.0" y="19.5" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#C5CCD6">Node.js</text></g><g transform="translate(206 204)"><rect x=".5" y=".5" width="61" height="29" rx="14.5" fill="#0D1118" fill-opacity=".6" stroke="#2A3240"/><text x="31.0" y="19.5" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#C5CCD6">React</text></g><g transform="translate(276 204)"><rect x=".5" y=".5" width="47" height="29" rx="14.5" fill="#0D1118" fill-opacity=".6" stroke="#2A3240"/><text x="24.0" y="19.5" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#C5CCD6">Vue</text></g><g transform="translate(332 204)"><rect x=".5" y=".5" width="79" height="29" rx="14.5" fill="#0D1118" fill-opacity=".6" stroke="#2A3240"/><text x="40.0" y="19.5" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#C5CCD6">AI · RAG</text></g>
  <text x="48" y="276" class="mono" font-size="14" xml:space="preserve"><tspan fill="#4E5766">~ $ </tspan><tspan fill="#8A94A3">now building </tspan><tspan class="ph p1" fill="#60A5FA" font-weight="700">SaaS platforms</tspan></text><text x="48" y="276" class="mono" font-size="14" xml:space="preserve"><tspan fill="#4E5766" fill-opacity="0">~ $ </tspan><tspan fill="#8A94A3" fill-opacity="0">now building </tspan><tspan class="ph p2" fill="#60A5FA" fill-opacity="0" font-weight="700">AI-powered search</tspan></text><text x="48" y="276" class="mono" font-size="14" xml:space="preserve"><tspan fill="#4E5766" fill-opacity="0">~ $ </tspan><tspan fill="#8A94A3" fill-opacity="0">now building </tspan><tspan class="ph p3" fill="#60A5FA" fill-opacity="0" font-weight="700">high-traffic APIs</tspan></text>

  <circle cx="728" cy="150" r="104" stroke="#1C2330"/>
  <circle cx="728" cy="150" r="72" stroke="#1C2330" stroke-dasharray="3 7"/>
  <circle cx="728" cy="150" r="132" stroke="#3B82F6" stroke-opacity=".18" stroke-dasharray="1 10"/>
  <g class="spinr"><circle cx="818.1" cy="202.0" r="9.9" fill="#3B82F6" fill-opacity=".15"/><circle cx="818.1" cy="202.0" r="4.5" fill="#3B82F6"/><circle cx="637.9" cy="202.0" r="7.7" fill="#93C5FD" fill-opacity=".15"/><circle cx="637.9" cy="202.0" r="3.5" fill="#93C5FD"/><circle cx="728.0" cy="46.0" r="7.7" fill="#5B6B85" fill-opacity=".15"/><circle cx="728.0" cy="46.0" r="3.5" fill="#5B6B85"/></g>
  <g class="spin"><circle cx="800.0" cy="150.0" r="9.9" fill="#60A5FA" fill-opacity=".15"/><circle cx="800.0" cy="150.0" r="4.5" fill="#60A5FA"/><circle cx="656.0" cy="150.0" r="7.7" fill="#5B6B85" fill-opacity=".15"/><circle cx="656.0" cy="150.0" r="3.5" fill="#5B6B85"/></g>
  <g class="glow"><circle cx="728" cy="150" r="62" fill="#3B82F6" fill-opacity=".08"/></g>
  <circle cx="728" cy="150" r="46" fill="#0D1118" stroke="#3B82F6" stroke-opacity=".8" stroke-width="1.5"/>
  <text x="728" y="161" text-anchor="middle" class="mono" font-size="30" font-weight="800" fill="#60A5FA">&lt;/&gt;</text>

  <g transform="translate(652 272)">
    <rect x=".5" y=".5" width="209" height="27" rx="13.5" fill="#0D1118" fill-opacity=".7" stroke="#2A3240"/>
    <circle cx="17" cy="14" r="4" fill="#60A5FA" class="pulse"/>
    <circle cx="17" cy="14" r="4" fill="#60A5FA"/>
    <text x="29" y="18.5" class="sans" font-size="12" font-weight="600" fill="#C5CCD6">Open to remote collaboration</text>
  </g>
</g>
<rect x=".5" y=".5" width="899" height="319" rx="19.5" stroke="url(#edge)"/>
</svg>