<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" fill="none" role="img" aria-label="Muhammad Ahmad Rauf, Senior Full Stack Engineer">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="900" y2="320" gradientUnits="userSpaceOnUse"><stop stop-color="#050816"/><stop offset="1" stop-color="#0D1433"/></linearGradient>
  <radialGradient id="oA"><stop stop-color="#3B82F6" stop-opacity=".55"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></radialGradient>
  <radialGradient id="oB"><stop stop-color="#8B5CF6" stop-opacity=".5"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
  <radialGradient id="oC"><stop stop-color="#06B6D4" stop-opacity=".35"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0"/></radialGradient>
  <linearGradient id="name" x1="48" y1="0" x2="520" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset=".6" stop-color="#DBEAFE"/><stop offset="1" stop-color="#A5B4FC"/></linearGradient>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38BDF8"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="900" y2="320" gradientUnits="userSpaceOnUse"><stop stop-color="#3B82F6" stop-opacity=".7"/><stop offset=".45" stop-color="#1E293B"/><stop offset="1" stop-color="#8B5CF6" stop-opacity=".7"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" stroke="#FFFFFF" stroke-opacity=".045"/></pattern>
  <radialGradient id="fade" cx=".3" cy=".4" r=".8"><stop stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <mask id="gridMask"><rect width="900" height="320" fill="url(#fade)"/></mask>
  <clipPath id="clip"><rect width="900" height="320" rx="20"/></clipPath>
</defs>
<style>
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
  .mono{font-family:'SFMono-Regular','JetBrains Mono',Consolas,'Liberation Mono',Menlo,monospace}

  .fa{animation:fa 14s ease-in-out infinite}
  .fb{animation:fb 18s ease-in-out infinite}
  .fc{animation:fa 22s ease-in-out infinite reverse}
  @keyframes fa{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,30px)}}
  @keyframes fb{0%,100%{transform:translate(0,0)}50%{transform:translate(-70px,-20px)}}
  .spin{transform-origin:728px 150px;animation:spin 26s linear infinite}
  .spinr{transform-origin:728px 150px;animation:spin 40s linear infinite reverse}
  @keyframes spin{to{transform:rotate(360deg)}}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
  @keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(3);opacity:0}}
  .ph{animation:ph 9s linear infinite}
  .p2{animation-delay:3s} .p3{animation-delay:6s}
  @keyframes ph{0%{fill-opacity:0}4%{fill-opacity:1}30%{fill-opacity:1}34%{fill-opacity:0}100%{fill-opacity:0}}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .glow{animation:glow 4s ease-in-out infinite}
  @keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
</style>
<g clip-path="url(#clip)">
  <rect width="900" height="320" fill="url(#bg)"/>
  <rect width="900" height="320" fill="url(#grid)" mask="url(#gridMask)"/>
  <circle class="fa" cx="120" cy="30" r="240" fill="url(#oA)"/>
  <circle class="fb" cx="800" cy="300" r="240" fill="url(#oB)"/>
  <circle class="fc" cx="520" cy="-20" r="170" fill="url(#oC)"/>

  <!-- tag -->
  <g transform="translate(48 38)">
    <rect width="262" height="28" rx="14" fill="#3B82F6" fill-opacity=".12" stroke="#3B82F6" stroke-opacity=".45"/>
    <circle cx="16" cy="14" r="3.5" fill="#60A5FA" class="glow"/>
    <text x="28" y="18.5" class="mono" font-size="11" font-weight="700" letter-spacing="1.8" fill="#93C5FD">SENIOR FULL STACK ENGINEER</text>
  </g>

  <text x="46" y="124" class="sans" font-size="46" font-weight="800" letter-spacing="-1" fill="url(#name)">Muhammad Ahmad Rauf</text>
  <text x="48" y="160" class="sans" font-size="17" fill="#94A3B8">I design and ship fast, scalable web platforms,</text>
  <text x="48" y="184" class="sans" font-size="17" fill="#94A3B8">from clean APIs to <tspan fill="#E2E8F0" font-weight="600">interfaces people enjoy using.</tspan></text>
  <g transform="translate(48 204)"><rect width="82" height="30" rx="15" fill="#0F172A" stroke="#26324A"/><circle cx="16" cy="15" r="4" fill="#FF2D20"/><text x="27" y="19.5" class="sans" font-size="13" font-weight="600" fill="#CBD5E1">Laravel</text></g><g transform="translate(138 204)"><rect width="82" height="30" rx="15" fill="#0F172A" stroke="#26324A"/><circle cx="16" cy="15" r="4" fill="#68A063"/><text x="27" y="19.5" class="sans" font-size="13" font-weight="600" fill="#CBD5E1">Node.js</text></g><g transform="translate(228 204)"><rect width="72" height="30" rx="15" fill="#0F172A" stroke="#26324A"/><circle cx="16" cy="15" r="4" fill="#61DAFB"/><text x="27" y="19.5" class="sans" font-size="13" font-weight="600" fill="#CBD5E1">React</text></g><g transform="translate(308 204)"><rect width="58" height="30" rx="15" fill="#0F172A" stroke="#26324A"/><circle cx="16" cy="15" r="4" fill="#42B883"/><text x="27" y="19.5" class="sans" font-size="13" font-weight="600" fill="#CBD5E1">Vue</text></g><g transform="translate(374 204)"><rect width="90" height="30" rx="15" fill="#0F172A" stroke="#26324A"/><circle cx="16" cy="15" r="4" fill="#A78BFA"/><text x="27" y="19.5" class="sans" font-size="13" font-weight="600" fill="#CBD5E1">AI · RAG</text></g>
  <text x="48" y="276" class="mono" font-size="14" xml:space="preserve"><tspan fill="#475569">~ $ </tspan><tspan fill="#94A3B8">now building </tspan><tspan class="ph p1" fill="#38BDF8" font-weight="700">SaaS platforms</tspan></text><text x="48" y="276" class="mono" font-size="14" xml:space="preserve"><tspan fill="#475569" fill-opacity="0">~ $ </tspan><tspan fill="#94A3B8" fill-opacity="0">now building </tspan><tspan class="ph p2" fill="#A78BFA" fill-opacity="0" font-weight="700">AI-powered search</tspan></text><text x="48" y="276" class="mono" font-size="14" xml:space="preserve"><tspan fill="#475569" fill-opacity="0">~ $ </tspan><tspan fill="#94A3B8" fill-opacity="0">now building </tspan><tspan class="ph p3" fill="#34D399" fill-opacity="0" font-weight="700">high-traffic APIs</tspan></text>

  <!-- orbit -->
  <circle cx="728" cy="150" r="104" stroke="#233152" stroke-width="1"/>
  <circle cx="728" cy="150" r="72" stroke="#233152" stroke-width="1" stroke-dasharray="3 7"/>
  <circle cx="728" cy="150" r="132" stroke="url(#acc)" stroke-opacity=".25" stroke-width="1" stroke-dasharray="1 10"/>
  <g class="spinr"><circle cx="818.1" cy="202.0" r="11" fill="#42B883" opacity=".18"/><circle cx="818.1" cy="202.0" r="5" fill="#42B883"/><circle cx="637.9" cy="202.0" r="11" fill="#F7DF1E" opacity=".18"/><circle cx="637.9" cy="202.0" r="5" fill="#F7DF1E"/><circle cx="728.0" cy="46.0" r="11" fill="#A78BFA" opacity=".18"/><circle cx="728.0" cy="46.0" r="5" fill="#A78BFA"/></g>
  <g class="spin"><circle cx="800.0" cy="150.0" r="11" fill="#61DAFB" opacity=".18"/><circle cx="800.0" cy="150.0" r="5" fill="#61DAFB"/><circle cx="656.0" cy="150.0" r="11" fill="#FF2D20" opacity=".18"/><circle cx="656.0" cy="150.0" r="5" fill="#FF2D20"/></g>
  <g class="glow"><circle cx="728" cy="150" r="62" fill="#3B82F6" fill-opacity=".12"/></g>
  <circle cx="728" cy="150" r="46" fill="#0A1024" stroke="url(#acc)" stroke-width="2"/>
  <text x="728" y="161" text-anchor="middle" class="mono" font-size="30" font-weight="800" fill="url(#acc)">&lt;/&gt;</text>

  <!-- status -->
  <g transform="translate(652 272)">
    <rect width="210" height="28" rx="14" fill="#052E1A" fill-opacity=".6" stroke="#10B981" stroke-opacity=".45"/>
    <circle cx="17" cy="14" r="4" fill="#34D399" class="pulse"/>
    <circle cx="17" cy="14" r="4" fill="#34D399"/>
    <text x="29" y="18.5" class="sans" font-size="12" font-weight="600" fill="#A7F3D0">Open to remote collaboration</text>
  </g>
</g>
<rect x=".5" y=".5" width="899" height="319" rx="19.5" stroke="url(#edge)"/>
</svg>