  <text x="44" y="76" text-anchor="end" class="mono" font-size="12.5" fill="#334155">1</text><text x="64" y="76" class="mono" font-size="14" xml:space="preserve"><tspan fill="#5B6B85" font-style="italic">// Most of my client work lives in private repos (NDA).</tspan></text><text x="44" y="99" text-anchor="end" class="mono" font-size="12.5" fill="#334155">2</text><text x="64" y="99" class="mono" font-size="14" xml:space="preserve"><tspan fill="#5B6B85" font-style="italic">// Happy to walk you through architecture &amp; code on a call.</tspan></text><text x="44" y="122" text-anchor="end" class="mono" font-size="12.5" fill="#334155">3</text><text x="44" y="145" text-anchor="end" class="mono" font-size="12.5" fill="#334155">4</text><text x="64" y="145" class="mono" font-size="14" xml:space="preserve"><tspan fill="#C084FC">const </tspan><tspan fill="#7DD3FC">ahmad</tspan><tspan fill="#CBD5E1"> = {</tspan></text><text x="44" y="168" text-anchor="end" class="mono" font-size="12.5" fill="#334155">5</text><text x="64" y="168" class="mono" font-size="14" xml:space="preserve"><tspan fill="#CBD5E1">  </tspan><tspan fill="#93C5FD">role</tspan><tspan fill="#CBD5E1">: </tspan><tspan fill="#86EFAC">&quot;Senior Full Stack Engineer&quot;</tspan><tspan fill="#CBD5E1">,</tspan></text><text x="44" y="191" text-anchor="end" class="mono" font-size="12.5" fill="#334155">6</text><text x="64" y="191" class="mono" font-size="14" xml:space="preserve"><tspan fill="#CBD5E1">  </tspan><tspan fill="#93C5FD">location</tspan><tspan fill="#CBD5E1">: </tspan><tspan fill="#86EFAC">&quot;Lahore, Pakistan (UTC+5)&quot;</tspan><tspan fill="#CBD5E1">,</tspan></text><text x="44" y="214" text-anchor="end" class="mono" font-size="12.5" fill="#334155">7</text><text x="64" y="214" class="mono" font-size="14" xml:space="preserve"><tspan fill="#CBD5E1">  </tspan><tspan fill="#93C5FD">codingSince</tspan><tspan fill="#CBD5E1">: </tspan><tspan fill="#FBBF24">2018</tspan><tspan fill="#CBD5E1">,</tspan></text><text x="44" y="237" text-anchor="end" class="mono" font-size="12.5" fill="#334155">8</text><text x="64" y="237" class="mono" font-size="14" xml:space="preserve"><tspan fill="#CBD5E1">  </tspan><tspan fill="#93C5FD">stack</tspan><tspan fill="#CBD5E1">: {</tspan></text><text x="44" y="260" text-anchor="end" class="mono" font-size="12.5" fill="#334155">9</text><text x="64" y="260" class="mono" font-size="14" xml:space="preserve"><tspan fill="#CBD5E1">    </tspan><tspan fill="#93C5FD">frontend</tspan><tspan fill="#CBD5E1">: [</tspan><tspan fill="#86EFAC">&quot;React&quot;</tspan><tspan fill="#CBD5E1">, </tspan><tspan fill="#86EFAC">&quot;Next.js&quot;</tspan><tspan fill="#CBD5E1">, </tspan><tspan fill="#86EFAC">&quot;Vue&quot;</tspan><tspan fill="#CBD5E1">, </tspan><tspan fill="#86EFAC">&quot;Nuxt&quot;</tspan><tspan fill="#CBD5E1">, </tspan><tspan fill="#86EFAC">&quot;Tailwind&quot;</tspan><tspan fill="#CBD5E1">],</tspan></text><text x="44" y="283" text-anchor="end" class="mono" font-size="12.5" fill="#334155">10</text><text x="64" y="283" class="mono" font-size="14" xml:space="preserve"><tspan fill="#CBD5E1">    </tspan><tspan fill="#93C5FD">backend</tspan><tspan fill="#CBD5E1">:  [</tspan><tspan fill="#86EFAC">&quot;Laravel&quot;</tspan><tspan fill="#CBD5E1">, </tspan><tspan fill="#86EFAC">&quot;Node.js&quot;</tspan><tspan fill="#CBD5E1">, </tspan><tspan fill="#86EFAC">&quot;NestJS&quot;</tspan><tspan fill="#CBD5E1">, </tspan><tspan fill="#86EFAC">&quot;GraphQL&quot;</tspan><tspan fill="#CBD5E1">],</tspan></text><text x="44" y="306" text-anchor="end" class="mono" font-size="12.5" fill="#334155">11</text><text x="64" y="306" class="mono" font-size="14" xml:space="preserve"><tspan fill="#CBD5E1">    </tspan><tspan fill="#93C5FD">data</tspan><tspan fill="#CBD5E1">:     [</tspan><tspan fill="#86EFAC">&quot;MySQL&quot;</tspan><tspan fill="#CBD5E1">, </tspan><tspan fill="#86EFAC">&quot;PostgreSQL&quot;</tspan><tspan fill="#CBD5E1">, </tspan><tspan fill="#86EFAC">&quot;MongoDB&quot;</tspan><tspan fill="#CBD5E1">, </tspan><tspan fill="#86EFAC">&quot;Redis&quot;</tspan><tspan fill="#CBD5E1">],</tspan></text><text x="44" y="329" text-anchor="end" class="mono" font-size="12.5" fill="#334155">12</text><text x="64" y="329" class="mono" font-size="14" xml:space="preserve"><tspan fill="#CBD5E1">    </tspan><tspan fill="#93C5FD">cloud</tspan><tspan fill="#CBD5E1">:    [</tspan><tspan fill="#86EFAC">&quot;AWS&quot;</tspan><tspan fill="#CBD5E1">, </tspan><tspan fill="#86EFAC">&quot;Azure&quot;</tspan><tspan fill="#CBD5E1">, </tspan><tspan fill="#86EFAC">&quot;GCP&quot;</tspan><tspan fill="#CBD5E1">, </tspan><tspan fill="#86EFAC">&quot;Docker&quot;</tspan><tspan fill="#CBD5E1">, </tspan><tspan fill="#86EFAC">&quot;K8s&quot;</tspan><tspan fill="#CBD5E1">],</tspan></text><text x="44" y="352" text-anchor="end" class="mono" font-size="12.5" fill="#334155">13</text><text x="64" y="352" class="mono" font-size="14" xml:space="preserve"><tspan fill="#CBD5E1">  },</tspan></text><text x="44" y="375" text-anchor="end" class="mono" font-size="12.5" fill="#334155">14</text><text x="64" y="375" class="mono" font-size="14" xml:space="preserve"><tspan fill="#CBD5E1">  </tspan><tspan fill="#93C5FD">focus</tspan><tspan fill="#CBD5E1">: [</tspan><tspan fill="#86EFAC">&quot;SaaS&quot;</tspan><tspan fill="#CBD5E1">, </tspan><tspan fill="#86EFAC">&quot;APIs &amp; integrations&quot;</tspan><tspan fill="#CBD5E1">, </tspan><tspan fill="#86EFAC">&quot;AI search (RAG)&quot;</tspan><tspan fill="#CBD5E1">],</tspan></text><text x="44" y="398" text-anchor="end" class="mono" font-size="12.5" fill="#334155">15</text><text x="64" y="398" class="mono" font-size="14" xml:space="preserve"><tspan fill="#CBD5E1">  </tspan><tspan fill="#93C5FD">workStyle</tspan><tspan fill="#CBD5E1">: </tspan><tspan fill="#86EFAC">&quot;remote-first, async, owns it end to end&quot;</tspan><tspan fill="#CBD5E1">,</tspan></text><text x="44" y="421" text-anchor="end" class="mono" font-size="12.5" fill="#334155"